<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>XXC | لوحة الإدارة</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="/">XX<span>C</span></a><a class="admin-link" href="/">عرض الموقع</a></div></header>
<main class="wrap admin-wrap"><section id="loginBox" class="panel narrow"><span class="tag">منطقة خاصة</span><h1>تسجيل دخول الإدارة</h1><p class="muted">هذه الصفحة مخصصة لصاحب الموقع فقط.</p><form id="loginForm"><label>كلمة المرور</label><input class="field" type="password" name="password" required minlength="12" autocomplete="current-password"><button class="primary" type="submit">دخول</button></form><p id="loginMsg" class="message"></p></section>
<section id="dashboard" hidden><div class="section-head"><div><h1>لوحة التحكم</h1><p class="muted">أضف تطبيقات APK وأدر التطبيقات المنشورة.</p></div><button id="logout" class="secondary">تسجيل خروج</button></div>
<div class="panel"><h2>نشر تطبيق جديد</h2><form id="appForm" class="form-grid" enctype="multipart/form-data">
<div><label>اسم التطبيق</label><input class="field" name="name" maxlength="70" required></div><div><label>الإصدار</label><input class="field" name="version" placeholder="1.0.0" maxlength="30" required></div>
<div><label>التصنيف</label><select class="field" name="category"><option>أدوات</option><option>إنتاجية</option><option>ترفيه</option><option>أخرى</option></select></div><div><label>ملف APK (حد أقصى 200MB)</label><input class="field" type="file" name="apk" accept=".apk,application/vnd.android.package-archive" required></div>
<div class="full"><label>وصف التطبيق</label><textarea class="field" name="description" rows="3" maxlength="500" required></textarea></div><div class="full"><button class="primary" type="submit">نشر التطبيق</button><span id="uploadMsg" class="message"></span></div></form></div>
<div class="panel"><h2>التطبيقات المنشورة</h2><div id="adminApps" class="admin-list"></div></div></section></main>
<footer>XXC Admin</footer><script src="/admin.js"></script></body></html>
